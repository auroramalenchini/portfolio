name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# Permisos que pide GitHub Pages cuando se publica desde Actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy a la vez; si entran dos pushes seguidos, gana el último.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: 22
          # Explícito para que corra el postbuild que poda dist/_astro.
          build_cmd: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
